name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verificar site e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verificar páginas de origem
        run: python tools/check.py
      - name: Testar publicação na raiz e em subdiretórios
        run: python -m unittest discover -s tests -v

  build:
    name: Preparar arquivos estáticos
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Obter endereço do GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Preparar site para o endereço configurado
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/prepare_pages.py --base-url "$PAGES_BASE_URL" --output artifacts/pages
      - name: Verificar site gerado
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python tools/check.py --root artifacts/pages --base-path "$PAGES_BASE_PATH" --production
      - name: Enviar somente o site publicado
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
